name: guacenc Docker image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/guacenc-docker.yml
      - Dockerfile.guacenc
      - src/common/**
      - src/guacenc/**
      - src/guacenc-docker/**
      - src/guacd-docker/bin/list-dependencies.sh
      - src/libguac/**
      - configure.ac
      - Makefile.am
  pull_request:
    paths:
      - .github/workflows/guacenc-docker.yml
      - Dockerfile.guacenc
      - src/common/**
      - src/guacenc/**
      - src/guacenc-docker/**
      - src/guacd-docker/bin/list-dependencies.sh
      - src/libguac/**
      - configure.ac
      - Makefile.am
  workflow_dispatch:

concurrency:
  group: guacenc-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/guacenc

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and publish image (linux/arm64)
    # Native ARM64 runner — produces an image for Apple Silicon Macs (M1/M2/M3/M4)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=arm64,enable={{is_default_branch}}
            type=sha,prefix=
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.guacenc
          target: runtime
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

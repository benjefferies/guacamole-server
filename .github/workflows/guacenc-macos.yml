name: guacenc macOS binary

on:
  push:
    branches:
      - main
    tags:
      - guacenc-macos-v*
    paths:
      - .github/workflows/guacenc-macos.yml
      - scripts/build-guacenc-macos.sh
      - configure.ac
      - src/common/**
      - src/guacenc/**
      - src/libguac/**
      - Makefile.am
  pull_request:
    paths:
      - .github/workflows/guacenc-macos.yml
      - scripts/build-guacenc-macos.sh
      - configure.ac
      - src/common/**
      - src/guacenc/**
      - src/libguac/**
      - Makefile.am
  workflow_dispatch:

concurrency:
  group: guacenc-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build macOS binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install autoconf automake libtool pkg-config \
            cairo jpeg libpng ffmpeg webp ossp-uuid openssl@3

      - name: Build guacenc
        run: |
          chmod +x scripts/build-guacenc-macos.sh
          scripts/build-guacenc-macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: guacenc-macos-${{ matrix.arch }}
          path: dist/guacenc-*-macos-*.tar.gz
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/guacenc-macos-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/guacenc-*-macos-*.tar.gz
          generate_release_notes: true
